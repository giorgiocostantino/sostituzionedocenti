<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Sostituzioni Docenti — Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /*  */
        :root { --primary: #1a56a0; --dark: #102a4d; --bg: #f8fafc; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 1rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { opacity: 0.9; }
        .status-online { color: #10b981; font-size: 0.8rem; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        input, select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

<div id="app">
    <div style="display:flex; justify-content:center; align-items:center; height:100vh;">
        <p>Caricamento sistema...</p>
    </div>
</div>

<script>
// --- CONFIGURAZIONE SUPABASE ---
// Sostituisci questi valori con quelli del tuo progetto Supabase
const SUPABASE_URL = 'sb_publishable_QpKVh93RqZvgvL1IzY1Qrw_qGkOk2zj';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6cnlkdGJoeHF6bXllcmFrZHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NjkxMjcsImV4cCI6MjA5NDM0NTEyN30.ERUG7DB20zbmv8hAX1CYsceOl94XcB7inOV9IihkOWw';
const supabase = lib.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let STATE = {
    user: null,
    view: 'home',
    sostituzioni: []
};

// --- LOGICA DATI ---
async function fetchSostituzioni() {
    const { data, error } = await supabase
        .from('sostituzioni')
        .select('*')
        .order('data', { ascending: false });
    
    if (error) console.error("Errore fetch:", error);
    else {
        STATE.sostituzioni = data;
        render();
    }
}

async function aggiungiSostituzione(payload) {
    const { error } = await supabase
        .from('sostituzioni')
        .insert([payload]);
    
    if (error) alert("Errore nel salvataggio!");
    else fetchSostituzioni();
}

// --- RENDERING UI ---
function render() {
    const root = document.getElementById('app');
    
    if (!STATE.user) {
        root.innerHTML = renderLogin();
        return;
    }

    root.innerHTML = `
        <div class="container">
            <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem">
                <div>
                    <h1>🏫 Gestione Sostituzioni</h1>
                    <span class="status-online">● Database Cloud Connesso</span>
                </div>
                <button class="btn" onclick="logout()" style="background:#ef4444">Esci</button>
            </header>

            <div class="card">
                <h3>Nuova Sostituzione (Admin)</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px">
                    <input type="date" id="new-data">
                    <input type="text" id="new-doc-ass" placeholder="Docente Assente">
                    <input type="text" id="new-doc-sos" placeholder="Docente Sostituto">
                    <input type="text" id="new-classe" placeholder="Classe">
                    <input type="number" id="new-ora" placeholder="Ora (es. 1)">
                    <button class="btn" onclick="salvaNuova()">Invia a tutti</button>
                </div>
            </div>

            <div class="card">
                <h3>Tabellone Sostituzioni</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Ora</th>
                            <th>Classe</th>
                            <th>Assente</th>
                            <th>Sostituto</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${STATE.sostituzioni.map(s => `
                            <tr>
                                <td>${s.data}</td>
                                <td>${s.ora}°</td>
                                <td><b>${s.classe}</b></td>
                                <td>${s.docente_assente}</td>
                                <td style="color:var(--primary); font-weight:bold">${s.docente_sostituto}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function renderLogin() {
    return `
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:var(--dark)">
            <div class="card" style="width:350px">
                <h2 style="text-align:center">Accesso al Sistema</h2>
                <input type="text" id="user" placeholder="Username" style="width:100%; margin:10px 0; padding:12px">
                <input type="password" id="pass" placeholder="Password" style="width:100%; margin:10px 0; padding:12px">
                <button class="btn" onclick="login()" style="width:100%; margin-top:10px">ENTRA</button>
            </div>
        </div>
    `;
}

// --- AZIONI ---
function login() {
    // Semplificato per demo. Supabase ha anche Auth integrata se serve.
    STATE.user = { nome: "Admin" };
    fetchSostituzioni();
}

function logout() {
    STATE.user = null;
    render();
}

async function salvaNuova() {
    const payload = {
        data: document.getElementById('new-data').value,
        docente_assente: document.getElementById('new-doc-ass').value,
        docente_sostituto: document.getElementById('new-doc-sos').value,
        classe: document.getElementById('new-classe').value,
        ora: parseInt(document.getElementById('new-ora').value)
    };
    await aggiungiSostituzione(payload);
}

// Avvio
render();
</script>
</body>
</html>
